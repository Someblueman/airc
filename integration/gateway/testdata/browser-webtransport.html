<!doctype html><meta charset="utf-8"><title>AIRC WebTransport fixture</title>
<pre id="status">Running...</pre>
<script type="module">
import { encryptEnvelope, signEnvelope, openEnvelopeTransport } from "/envelopes-webtransport.js";
import { messageText } from "/events-fetch.js";
const config = JSON.parse(document.querySelector("#config").textContent);
const status = document.querySelector("#status");
const check = (ok, message) => { if (!ok) throw new Error(message); status.textContent += "\nPASS " + message; };
const report = async value => { await fetch("/result", { method: "POST", body: value.slice(0, 4096), credentials: "omit", cache: "no-store" }); };
const decode = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
try {
  const signing = await crypto.subtle.importKey("jwk", config.signing, "Ed25519", false, ["sign"]);
  const recipient = await crypto.subtle.importKey("jwk", config.recipient, { name: "ECDH", namedCurve: "P-256" }, false, []);
  const pin = [{ algorithm: "sha-256", value: decode(config.leaf_hash) }];
  const transport = await openEnvelopeTransport(config.base, { serverCertificateHashes: pin });
  const make = async request => encryptEnvelope(recipient, "recipient", await signEnvelope(signing, "signer", config.audience, request));
  const call = async request => transport.call("encrypted", await make(request));
  const room = { kind: "room", name: "#gateway-fixture" };
  const send = { version: 1, request_id: "browser-webtransport-send", operation: "send", target: room, message: "browser WebTransport send 🙂" };
  const admission = await call(send); check(admission.result?.durable === true, "encrypted WebTransport admission");
  let receipt;
  for (let i = 0; i < 50; i++) { receipt = await call({ version: 1, request_id: "wt-receipt-" + i, operation: "receipt.get", lookup_id: send.request_id }); if (receipt.result?.state === "accepted") break; await new Promise(r => setTimeout(r, 100)); }
  receipt = receipt.result; check(receipt?.state === "accepted" && receipt.send_attempts === 1 && receipt.lookup_attempts === 0, "native accepted receipt");
  const reply = { version: 1, request_id: "browser-webtransport-reply", operation: "reply", target: room, parent_id: receipt.message_id, message: "browser WebTransport reply" };
  check((await call(reply)).result?.durable === true, "encrypted WebTransport reply admission");
  let replyReceipt;
  for (let i = 0; i < 50; i++) { replyReceipt = await call({ version: 1, request_id: "wt-reply-receipt-" + i, operation: "receipt.get", lookup_id: reply.request_id }); if (replyReceipt.result?.state === "accepted") break; await new Promise(r => setTimeout(r, 100)); }
  replyReceipt = replyReceipt.result; check(replyReceipt?.state === "accepted" && replyReceipt.send_attempts === 1 && replyReceipt.lookup_attempts === 0, "native accepted reply receipt");
  const historyResponse = await call({ version: 1, request_id: "browser-webtransport-history", operation: "history.read", target: room, start: "retained", limit: 16 });
  const history = historyResponse.page;
  check(history.messages?.length === 2 && messageText(history.messages[0]) === send.message && messageText(history.messages[1]) === reply.message && history.messages[1].reply_to === receipt.message_id, "WebTransport history read and reply linkage");
  let triggered = false, sawLive = false;
  const watch = transport.watch("encrypted", await make({ version: 1, request_id: "browser-webtransport-watch", operation: "watch", target: room, start: "retained", limit: 16 }));
  for await (const page of watch) {
    check(typeof page.cursor === "string", "WebTransport watch cursor");
    if (!triggered) { await call({ version: 1, request_id: "browser-webtransport-live", operation: "send", target: room, message: "browser WebTransport live" }); triggered = true; }
    if (page.messages?.some(m => messageText(m) === "browser WebTransport live")) { sawLive = true; break; }
  }
  check(sawLive, "WebTransport live watch and cancellation");
  const large = { version: 1, request_id: "browser-webtransport-datagram", operation: "send", target: room, message: "browser datagram " + "x".repeat(1200) };
  const datagram = await transport.call("encrypted", await make(large), { mode: "datagram" });
  check(datagram.result?.durable === true, "fragmented WebTransport datagram");
  let datagramReceipt;
  for (let i = 0; i < 50; i++) { datagramReceipt = await call({ version: 1, request_id: "wt-datagram-receipt-" + i, operation: "receipt.get", lookup_id: large.request_id }); if (datagramReceipt.result?.state === "accepted") break; await new Promise(r => setTimeout(r, 100)); }
  datagramReceipt = datagramReceipt.result; check(datagramReceipt?.state === "accepted" && datagramReceipt.send_attempts === 1 && datagramReceipt.lookup_attempts === 0, "native accepted fragmented datagram");
  const uni = await transport.call("encrypted", await make({ version: 1, request_id: "browser-webtransport-uni", operation: "receipt.get", lookup_id: send.request_id }), { mode: "uni" });
  check(uni.result?.state === "accepted", "WebTransport unidirectional response");
  const uniWatch = transport.watch("encrypted", await make({ version: 1, request_id: "browser-webtransport-uni-watch", operation: "watch", target: room, start: "retained", limit: 16 }), { mode: "uni" });
  for await (const page of uniWatch) { check(page.messages?.length === 4 && typeof page.cursor === "string", "unidirectional watch and cancellation"); break; }
  const afterCancel = await transport.call("encrypted", await make({ version: 1, request_id: "browser-webtransport-uni-reuse", operation: "receipt.get", lookup_id: send.request_id }), { mode: "uni" });
  check(afterCancel.result?.state === "accepted", "unidirectional session reuse after watch cancellation");
  const datagramWatch = transport.watch("encrypted", await make({ version: 1, request_id: "browser-webtransport-datagram-watch", operation: "watch", target: room, start: "retained", limit: 16 }), { mode: "datagram" });
  for await (const page of datagramWatch) { check(page.messages?.length === 4 && typeof page.cursor === "string", "fragmented datagram watch and session cancellation"); break; }
  await transport.close();
  const reconnected = await openEnvelopeTransport(config.base, { serverCertificateHashes: pin, signal: new AbortController().signal });
  const signedCapabilities = await signEnvelope(signing, "signer", config.audience, { version: 1, request_id: "browser-webtransport-signed-capabilities", operation: "capabilities.get" });
  const capabilities = await reconnected.call("signed", signedCapabilities);
  check(JSON.stringify(capabilities.capabilities?.operations) === JSON.stringify(config.operations), "signed capability discovery after reconnect");
  const quietAbort = new AbortController();
  const quietWatch = reconnected.watch("encrypted", await make({ version: 1, request_id: "browser-webtransport-abort-quiet", operation: "watch", target: room, start: "retained", limit: 16 }), { mode: "uni", signal: quietAbort.signal });
  check((await quietWatch.next()).value.messages?.length === 4, "quiet unidirectional watch admission");
  const pendingQuiet = quietWatch.next();
  const abortTimer = setTimeout(() => quietAbort.abort(), 100);
  let canceled = false;
  try { await pendingQuiet; } catch (error) { canceled = error.name === "AbortError"; }
  finally { clearTimeout(abortTimer); }
  check(canceled, "quiet watch abort settles without a live event");
  const reused = await reconnected.call("signed", await signEnvelope(signing, "signer", config.audience, { version: 1, request_id: "browser-webtransport-after-abort", operation: "capabilities.get" }));
  check(reused.capabilities?.operations.length === config.operations.length, "session remains usable after quiet abort");
  await reconnected.close();
  status.textContent += "\nALL PASS";
  await report("PASS");
} catch (error) {
  status.textContent += "\nFAIL " + error.message;
  await report("FAIL " + error.message);
}
</script>
