# Fast tier: runs on every pull request and every push to main. The gateway
# module (gateway/) dominates the ~25 minute full suite, so its tests are
# left to nightly.yml; it is still built, vetted and staticchecked here, in
# workspace mode from the root (`./...` names only the root module's
# packages, so the gateway is named too). The product's tests run with the
# workspace off, as a consumer of the root module builds it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            gateway/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet (both modules)
        run: go vet ./... ./gateway/...

      - name: staticcheck (both modules)
        run: go tool staticcheck ./... ./gateway/...

      - name: go build (both modules)
        run: go build ./... ./gateway/...

      # cmd/airc's fallback tests build airc-gateway from gateway/ and run it
      # as a child process; the product links none of the gateway's packages.
      - name: unit tests (product, workspace off)
        run: GOWORK=off go test -count=1 -timeout 15m ./...

      - name: fuzz smoke (protocol parser, 20s)
        run: go test -run '^$' -fuzz FuzzParse -fuzztime 20s ./internal/protocol/
