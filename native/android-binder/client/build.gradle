plugins {
    id 'com.android.application'
}

android {
    namespace 'org.airc.gateway.client'
    compileSdk 35

    defaultConfig {
        applicationId 'org.airc.gateway.binder.client'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += ['../shared/src/main/java']
    }
}
