# Provisioning template for vsftpd 3.0.5 with OpenSSL on Linux.
# Replace addresses, TLS paths, jail and allowlist before deployment.
# The allowlist and PAM service must admit only the dedicated inbox account.
listen=YES
listen_ipv6=NO
listen_address=192.0.2.10
listen_port=21
anonymous_enable=NO
local_enable=YES
guest_enable=NO
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd/airc-allowed-users
pam_service_name=airc-ftps
chroot_local_user=YES
chroot_list_enable=NO
local_root=/srv/airc-ftps/alice
ssl_enable=YES
implicit_ssl=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES
ssl_sslv2=NO
ssl_sslv3=NO
ssl_tlsv1=NO
ssl_tlsv1_1=NO
ssl_tlsv1_2=YES
ssl_tlsv1_3=YES
ssl_ciphers=HIGH:!aNULL:!MD5:!3DES
require_ssl_reuse=YES
strict_ssl_read_eof=YES
rsa_cert_file=/etc/vsftpd/airc-server-chain.pem
rsa_private_key_file=/etc/vsftpd/airc-server-key.pem
write_enable=YES
download_enable=YES
file_open_mode=0600
local_umask=077
chmod_enable=NO
ascii_upload_enable=NO
ascii_download_enable=NO
delete_failed_uploads=YES
port_enable=NO
pasv_enable=YES
pasv_promiscuous=NO
pasv_min_port=41000
pasv_max_port=41015
cmds_allowed=ABOR,AUTH,FEAT,OPTS,PBSZ,PROT,PWD,CWD,CDUP,TYPE,EPSV,PASV,STOR,RETR,RNFR,RNTO,DELE,SIZE,MDTM,NOOP,QUIT,SYST
max_clients=4
max_per_ip=2
max_login_fails=3
idle_session_timeout=60
data_connection_timeout=30
accept_timeout=10
local_max_rate=1048576
